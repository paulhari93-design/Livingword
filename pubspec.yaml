name: livingword
description: Tamil e-reader for translated messages.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Firebase: download messages/Bible and receive notifications ('any' = newest that fits).
  firebase_core: any
  cloud_firestore: any
  firebase_messaging: any
  path_provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    # Messages and the Bible are no longer inside the app: users download them.
    - assets/logo.png
    - assets/splash.jpg
    - assets/messages_logo.jpg

# App icon (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
